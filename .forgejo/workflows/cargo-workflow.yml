name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: codeberg-small
    container:
      image: danieltrick/rust-ci:r1
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v7

      - name: Platform Info
        working-directory: .github/workflows/tools/rustc-info
        run: cargo run --locked --quiet

      - name: Build
        run: make MK_NOTESTS=1
