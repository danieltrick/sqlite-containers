[package]
name = "sqlite-containers"
description = "SQLite-based containers for Rust"
version = "2.4.0-dev"
edition = "2024"
rust-version = "1.87.0"
authors = ["Daniel Trick <daniel.trick@sit.fraunhofer.de>"]
license = "Unlicense"
repository = "https://github.com/danieltrick/sqlite-containers/"
readme = "README-package.md"

[features]
default = ["bundled", "backup", "checked"]
backup = ["rusqlite/backup"]
bundled = ["rusqlite/bundled"]
checked = []
hooks = ["with_rowid", "rusqlite/hooks"]
with_rowid = []

[dependencies]
cfg-if = "1.0.5"
const_format = "0.2.36"
rusqlite = "0.40.2"
semver = "1.0.28"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
hex = "0.4.3"
primal = "0.3.3"
rand_xoshiro = "0.8.1"
random_word = { version = "0.5.2", features = ["de","en"] }
tempfile = "3.27.0"
xxhash-rust = { version = "0.8.19", features = ["xxh64"] }

[[bench]]
name = "sqlite_containers-bench"
harness = false

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
